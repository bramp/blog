name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Hugo version
        id: hugo-version
        run: |
          VERSION=$(tr -d '[:space:]' < .hugo-version)
          echo "HUGO_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected Hugo version: $VERSION"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: npm install

      - name: Install goredirects
        run: go install bramp.net/goredirects@latest

      - name: Build CSS (Chroma)
        run: make chromacss

      - name: Step 1: Initial Hugo Build
        run: make public

      - name: Step 2: Generate Go Redirects
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          make goredirects

      - name: Step 3: Asset Minification & Re-build
        run: make minified

      - name: Verify Build Artifacts
        run: |
          ls -R public/css/
          ls -R public/js/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
